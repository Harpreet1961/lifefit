apiVersion: v1
kind: LimitRange
metadata:
  name: lifefit-limits
spec:
  limits:
    - type: Container

      defaultRequest:
        cpu: "50m"
        memory: "64Mi"

      default:
        cpu: "250m"
        memory: "256Mi"

      max:
        cpu: "1"
        memory: "1Gi"

      min:
        cpu: "10m"
        memory: "16Mi"