apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifefit-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lifefit-backend-service
                port:
                  number: 5050

          - path: /
            pathType: Prefix
            backend:
              service:
                name: lifefit-frontend-service
                port:
                  number: 80