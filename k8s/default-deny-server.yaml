apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-netpol-server
spec:
  podSelector:
    matchLabels:
      app: netpol-server

  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed
      ports:
            - protocol: TCP
              port: 80
